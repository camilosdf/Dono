# monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s      # Coleta métricas a cada 15 segundos
  evaluation_interval: 15s  # Avalia regras de alerta a cada 15 segundos

# Configuração do Alertmanager (para onde enviar os alertas)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Arquivos com as regras de alerta
rule_files:
  - "alerts.yml"

# Targets a serem monitorados (scrape)
scrape_configs:
  - job_name: 'dono-backend'
    static_configs:
      - targets: ['dono-api-prod:8000']   # Nome do serviço no docker-compose.prod.yml
    metrics_path: '/metrics'
    scrape_interval: 10s